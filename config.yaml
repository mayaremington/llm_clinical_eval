# Encounters: ACI-Bench test split 1 (12 encounters, CC BY 4.0) plus 8 synthetic ED cases.
data:
  aci_bench_csv: data/aci_bench/clinicalnlp_taskB_test1.csv
  aci_bench_n: null     
  synthetic_ed_yaml: data/synthetic_ed/ed_cases.yaml
  seed: 13

# Systems under test. Same model in every system.
# 2 systems x 20 encounters = 40 notes
systems:
  - name: baseline
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: prompts/note_baseline.txt
  - name: grounded
    provider: anthropic
    model: claude-sonnet-5-5
    prompt: prompts/note_grounded.txt

generation:
  temperature: null
  max_tokens: 8000

# The judge. Uses a different model family from the one that writes the notes,
# to reduce self-preference bias.
judge:
  provider: openai
  model: gpt-6.1-sol
  prompt: prompts/judge.txt
  temperature: null
  max_tokens: 16000

# Pre-specified decision rule. Committed BEFORE looking at any results.
decision:
  primary_endpoint: any_error
  secondary_endpoints: [n_errors, any_moderate_plus, any_critical]
  reference_system: baseline
  candidate_system: grounded
  # superiority:     candidate has a LOWER major-error rate (CI upper bound < 0)
  # noninferiority:  candidate is at most `noninferiority_margin` worse (CI upper bound < margin)
  hypothesis: superiority
  noninferiority_margin: 0.10
  alpha: 0.05
